name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Format check, compile, unit & integration tests
        run: mvn -B verify

  docker-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - name: Run Docker crash/restart smoke test
        run: |
          chmod +x scripts/docker-crash-test.sh
          ./scripts/docker-crash-test.sh
          docker compose down -v